name: Pixi latest-dependencies canary

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pixi-environment: py311
          - python-version: "3.12"
            pixi-environment: py312
          - python-version: "3.13"
            pixi-environment: py313
          - python-version: "3.14"
            pixi-environment: py314
          - python-version: "3.15"
            pixi-environment: py315

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: ${{ matrix.pixi-environment }}
          cache: false
          run-install: false

      - name: Update latest dependencies
        run: pixi update -e "${{ matrix.pixi-environment }}"

      - name: Install latest environment
        run: pixi install -e "${{ matrix.pixi-environment }}"

      - name: Activate latest environment
        run: pixi shell-hook -e "${{ matrix.pixi-environment }}" >> "$GITHUB_ENV"

      - name: Run tests
        run: pixi run -e "${{ matrix.pixi-environment }}" test
