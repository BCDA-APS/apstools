name: Unit Tests & Code Coverage

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # allow manual triggering

defaults:
  run:
    shell: bash -l {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: py313
          activate-environment: true
          cache: true
          locked: true

      - name: Run pre-commit
        run: pixi run --locked -e py313 lint


  test-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pixi-environment: py311
          - python-version: "3.12"
            pixi-environment: py312
          - python-version: "3.13"
            pixi-environment: py313
          - python-version: "3.14"
            pixi-environment: py314
          - python-version: "3.15"
            pixi-environment: py315
      max-parallel: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: ${{ matrix.pixi-environment }}
          activate-environment: true
          cache: true
          locked: true

      - name: Diagnostics
        run: |
          set -euo pipefail
          pixi info
          pixi list -e "${{ matrix.pixi-environment }}"
          python --version
          python -m coverage --version
          command -v caget

      - name: Start EPICS IOCs in Docker
        run: |
          set -vxeuo pipefail
          bash ./.github/scripts/iocmgr.sh start GP gp
          bash ./.github/scripts/iocmgr.sh start ADSIM ad
          docker ps -a
          ls -lAFgh /tmp/docker_ioc/iocad/
          ls -lAFgh /tmp/docker_ioc/iocgp/

      - name: Confirm EPICS IOC is available via caget
        run: |
          set -vxeuo pipefail
          docker exec iocgp grep float1 /home/iocgp/dbl-all.txt
          docker exec iocgp /opt/base/bin/linux-x86_64/caget gp:UPTIME gp:gp:float1
          docker exec iocad /opt/base/bin/linux-x86_64/caget ad:cam1:Acquire_RBV
          caget gp:UPTIME
          caget gp:gp:float1
          caget ad:cam1:Acquire_RBV

      - name: Confirm EPICS IOC is available via PyEpics
        run: |
          python -c "import epics; print(epics.caget('gp:UPTIME'))"
          CMD="import epics"
          CMD+="; print(epics.caget('gp:UPTIME'))"
          python -c "${CMD}"

      - name: Confirm EPICS IOC is available via ophyd
        run: |
          CMD="import ophyd"
          CMD+="; up = ophyd.EpicsSignalRO('gp:UPTIME', name='up')"
          CMD+="; pv = ophyd.EpicsSignalRO('gp:gp:float1', name='pv')"
          CMD+="; up.wait_for_connection()"
          CMD+="; print(up.get(), pv.get())"
          python -c "${CMD}"

      - name: Run tests with pytest and coverage
        run: pixi run --locked -e "${{ matrix.pixi-environment }}" coverage-report

      - name: Upload coverage data to Coveralls
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.python-version }}
          COVERALLS_PARALLEL: true

  # https://coveralls-python.readthedocs.io/en/latest/usage/configuration.html#github-actions-support
  coveralls:
    name: Report unit test coverage to coveralls
    needs: test-matrix
    runs-on: ubuntu-latest
    container: python:3-slim

    steps:
      - name: Gather coverage and report to Coveralls
        run: |
          set -vxeuo pipefail
          echo "Finally!"
          pip3 install --upgrade coveralls
          # debug mode: output prepared json and reported files list to stdout
          # https://coveralls-python.readthedocs.io/en/latest/troubleshooting.html
          coveralls debug
          coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
